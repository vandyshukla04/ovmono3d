_BASE_: "OVMono3D_wildbox_wildlife5.yaml"

# Paper-protocol zero-shot: use precomputed GroundingDINO 2D boxes as
# the "oracle" input to the 3D cube head. Produced by
# tools/precompute_gdino_oracle.py. See WILDBOX_EXPERIMENT.md §6.4.
TEST:
  ORACLE2D: True
  # Extend Rel-AP3D scale search range for zero-shot. Fine-tuned runs
  # produce predictions already in WildBox's VGGT-synthetic scale
  # (best-scale ≈ 1.0), so the base config uses (0.3, 3.0, 28). Zero-shot
  # predictions from an Omni3D-metric-pretrained cube head need to be
  # down-scaled much more aggressively (observed best-scale ≈ 0.1–0.3)
  # to align with WildBox's median-|Z|=1 normalization. A search range
  # that doesn't cover 0.1 leaves Rel-AP3D pinned to its boundary and
  # understates the recoverable 3D performance.
  REL_AP3D_SEARCH: [0.05, 3.0, 32]

DATASETS:
  # Evaluator's class-mode hardcoded lookup path:
  #   cfg.DATASETS.ORACLE2D_FILES[EVAL_MODE].<mode>.<dataset_name>
  # Register WildBox_val under both target_aware and previous_metric so
  # either EVAL_MODE setting works.
  ORACLE2D_FILES:
    EVAL_MODE: target_aware
    target_aware:
      novel:
        WildBox_val: datasets/Omni3D/gdino_WildBox_val_oracle_2d.json
      base:
        WildBox_val: datasets/Omni3D/gdino_WildBox_val_oracle_2d.json
    previous_metric:
      novel:
        WildBox_val: datasets/Omni3D/gdino_WildBox_val_oracle_2d.json
      base:
        WildBox_val: datasets/Omni3D/gdino_WildBox_val_oracle_2d.json

OUTPUT_DIR: "output/ovmono3d_wildbox_wildlife5_oracle2d"
